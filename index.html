<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA / installability -->
    <link rel="manifest" href="/manifest.json" />
    <!-- theme-color: matches --bg for each theme so status bar + bottom nav blend in.
         JS in ThemeContext.jsx overrides these at runtime when the user toggles. -->
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clubsy" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Instantly apply saved theme before React mounts — prevents flash and
         ensures the OS status bar colour is correct from the very first frame. -->
    <script>
      (function () {
        var theme = localStorage.getItem("theme");
        if (!theme) theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        var color = theme === "light" ? "#faf8f3" : "#0a0e1a";
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.removeAttribute("media");
          m.setAttribute("content", color);
        });
      })();
    </script>

    <!-- SEO / share previews -->
    <meta name="description" content="Manage gym & venue memberships, track attendance and collect payments." />
    <meta property="og:title" content="Clubsy — Membership Manager" />
    <meta property="og:description" content="Manage gym & venue memberships, track attendance and collect payments." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:type" content="website" />

    <title>Clubsy — Membership Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
